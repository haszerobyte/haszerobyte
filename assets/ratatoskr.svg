<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title desc">
  <title id="title">ratatoskr</title>
  <desc id="desc">A squirrel on a branch carrying a red terminal prompt, inside a black badge with a red ring.</desc>

  <!-- badge -->
  <circle cx="128" cy="128" r="124" fill="#0b0b0d"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="#e5323b" stroke-width="4"/>

  <!-- branch -->
  <path d="M50 186 H 206" stroke="#3a3b40" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(6 0)">
  <!-- tail: one clean curl -->
  <path d="M118 176 C 76 176, 58 148, 62 114 C 66 82, 92 66, 116 72 C 136 77, 140 100, 124 108 C 114 113, 104 104, 110 96"
        fill="none" stroke="#ecedef" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ecedef">
    <ellipse cx="140" cy="154" rx="26" ry="30"/>
    <circle cx="160" cy="112" r="20"/>
    <path d="M172 104 L 190 116 L 172 126 Z"/>
    <path d="M148 98 L 150 76 L 164 94 Z"/>
    <ellipse cx="150" cy="182" rx="14" ry="5"/>
  </g>

  <!-- eye -->
  <circle cx="166" cy="108" r="3.4" fill="#e5323b"/>

  <!-- the message: a terminal prompt -->
  <rect x="160" y="132" width="34" height="28" rx="5" fill="#e5323b"/>
  <path d="M168 141 L 174 146 L 168 151" fill="none" stroke="#0b0b0d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 152 H 186" stroke="#0b0b0d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="162" cy="146" r="6" fill="#ecedef"/>
  </g>
</svg>
